<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ER-diagram for What the Dish database</title>
  <desc id="desc">Entity relationship diagram showing countries in a one-to-many relationship with dishes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155" />
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .title { fill: #0f172a; font: 700 38px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 20px Arial, sans-serif; }
      .entity { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .header { fill: #1f2937; }
      .entity-title { fill: #ffffff; font: 700 24px Arial, sans-serif; letter-spacing: 1px; }
      .field { fill: #0f172a; font: 18px Consolas, "Courier New", monospace; }
      .muted { fill: #64748b; font: 16px Arial, sans-serif; }
      .key { fill: #2563eb; font-weight: 700; }
      .relation { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .relation-label { fill: #0f172a; font: 700 19px Arial, sans-serif; }
      .note { fill: #334155; font: 18px Arial, sans-serif; }
      .note-bg { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
    </style>
  </defs>

  <rect class="page" width="1200" height="760" />

  <text x="600" y="72" text-anchor="middle" class="title">What the Dish?! - ER-diagram</text>
  <text x="600" y="108" text-anchor="middle" class="subtitle">Nuvarande SQLite-databas: countries och dishes</text>

  <g transform="translate(95 190)">
    <rect class="entity" x="0" y="0" width="390" height="360" rx="14" />
    <rect class="header" x="0" y="0" width="390" height="72" rx="14" />
    <path d="M0 58 H390 V72 H0 Z" class="header" />
    <text x="195" y="45" text-anchor="middle" class="entity-title">COUNTRIES</text>

    <text x="34" y="118" class="field"><tspan class="key">PK</tspan> country_id INTEGER</text>
    <text x="34" y="160" class="field"><tspan class="key">UK</tspan> country_name VARCHAR(100)</text>
    <text x="34" y="202" class="field">continent VARCHAR(50)</text>
    <text x="34" y="244" class="field">flag_url TEXT</text>

    <line x1="34" y1="278" x2="356" y2="278" stroke="#e2e8f0" stroke-width="2" />
    <text x="34" y="316" class="muted">Ett land kan ha flera maträtter.</text>
  </g>

  <g transform="translate(715 150)">
    <rect class="entity" x="0" y="0" width="390" height="440" rx="14" />
    <rect class="header" x="0" y="0" width="390" height="72" rx="14" />
    <path d="M0 58 H390 V72 H0 Z" class="header" />
    <text x="195" y="45" text-anchor="middle" class="entity-title">DISHES</text>

    <text x="34" y="118" class="field"><tspan class="key">PK</tspan> dish_id INTEGER</text>
    <text x="34" y="160" class="field"><tspan class="key">FK</tspan> country_id INTEGER</text>
    <text x="34" y="202" class="field">dish_name VARCHAR(100)</text>
    <text x="34" y="244" class="field">is_correct BOOLEAN</text>
    <text x="34" y="286" class="field">dish_image_url TEXT</text>
    <text x="34" y="328" class="field">dish_history TEXT</text>
    <text x="34" y="370" class="field">hint TEXT</text>

    <line x1="34" y1="402" x2="356" y2="402" stroke="#e2e8f0" stroke-width="2" />
    <text x="34" y="430" class="muted">UNIQUE(country_id, dish_name)</text>
  </g>

  <path class="relation" d="M485 370 C570 370 620 370 715 370" />
  <text x="600" y="335" text-anchor="middle" class="relation-label">1 till många</text>
  <text x="520" y="405" text-anchor="middle" class="muted">1</text>
  <text x="680" y="405" text-anchor="middle" class="muted">0..*</text>

  <g transform="translate(225 635)">
    <rect class="note-bg" x="0" y="0" width="750" height="72" rx="12" />
    <text x="375" y="31" text-anchor="middle" class="note">Varje dish tillhör exakt ett country via dishes.country_id.</text>
    <text x="375" y="56" text-anchor="middle" class="note">I nuvarande seed: 1 korrekt rätt och 3 felaktiga svarsalternativ per land.</text>
  </g>
</svg>
